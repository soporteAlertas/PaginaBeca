<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-image: url(imagenes/TRAMA_3.jpg) !important;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            max-width: 400px;
            padding: 40px;
            margin: 0 auto;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px gray;
        }

        img {
            width: 30%;
            display: inline-block;
            align-items: center;
            justify-content: center;
            padding: auto;
        }

        .link-card a {
            text-decoration: none;
            padding: 10px 20px;
            background-color: #17436B;
            color: white;
            font-size: 1.2rem;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .link-card a:hover {
            background-color: #D39A18;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #17436B;
            color: #D39A18;
            font-family: Arial, Helvetica, sans-serif;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal:target {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 800px;
            height: 400px;
            font-size: 3rem;
        }

        .icon {
            width: 200px;
            height: auto;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .cerrar {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #D39A18;
            font-weight: bold;
        }
    </style>
</head>

</head>

        <img src="imagenes\posgrado-unam.png" alt="logo-posgrado">

        <div class="link-card">
            <a href="#ventana">Ingresar</a>

        <div class="modal-content">
            <h2>¡Felicidades caiste! </h2>
