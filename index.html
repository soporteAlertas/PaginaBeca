<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de inicio de sesión moderna, segura y responsiva">
  <title>Iniciar Sesión</title>
  <!-- Fuente Google: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Hoja de estilos separada -->
  <link rel="stylesheet" href="styles.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZC0MXH236"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());

  gtag('config', 'G-3ZC0MXH236');
</script>

<body>
  <!-- Fondo con elementos decorativos difuminados -->
  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <main class="login-wrapper">
    <div class="login-card">
      <header class="card-header">
        <div class="brand-logo" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
        </div>
        <h1 class="card-title">Bienvenido de nuevo</h1>
        <p class="card-subtitle">Ingresa tus credenciales para acceder a tu cuenta</p>
      </header>

      <!-- Mensaje de estado dinámico (éxito / error) -->
      <div id="status-message" class="status-message" role="alert" aria-live="polite"></div>

      <form id="login-form" class="login-form" novalidate>
        <!-- Campo de Correo Electrónico -->
        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="input-container">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input type="email" id="email" name="email" class="form-input" placeholder="nombre@ejemplo.com"
              autocomplete="email" required>
          </div>
          <span class="field-error" id="email-error"></span>
        </div>

        <!-- Campo de Contraseña -->
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="form-label">Contraseña</label>
            <a href="#forgot" id="forgot-link" class="text-link">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-container">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••"
              autocomplete="current-password" required>
            <button type="button" id="toggle-password" class="password-toggle-btn"
              aria-label="Mostrar u ocultar contraseña" title="Mostrar contraseña">
              <!-- Ícono ojo abierto -->
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Ícono ojo tachado (oculto por defecto) -->
              <svg id="eye-off-icon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <!-- Recordarme -->
        <div class="checkbox-group">
          <label class="custom-checkbox">
            <input type="checkbox" id="remember-me" name="remember">
            <span class="checkbox-indicator"></span>
            <span class="checkbox-text">Recordar mi sesión</span>
          </label>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" id="submit-btn" class="btn-primary">
          <span class="btn-text">Iniciar Sesión</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>
      </form>

      <footer class="card-footer">
        <p>¿Aún no tienes cuenta? <a href="#register" class="text-link highlight">Regístrate gratis</a></p>
      </footer>
    </div>
  </main>

  <!-- Archivo JavaScript separado -->
  <script src="script.js"></script>
</body>

</html>
